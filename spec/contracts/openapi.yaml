openapi: 3.1.0
info:
  title: Multimodal Asset Library MVP API
  version: 1.0.0
paths:
  /api/uploads:
    post:
      summary: Upload one local image or H.264 MP4
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, directPublish]
              properties:
                file: { type: string, format: binary }
                frame:
                  type: array
                  description: Browser-generated JPEG keyframes; required for video and forbidden for images
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: binary }
                frameMetadata:
                  type: string
                  description: JSON containing durationSeconds and midpoint-quantile timestamps; required for video
                directPublish: { type: boolean }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadStatus" }
        "400": { $ref: "#/components/responses/Error" }
  /api/uploads/{uploadId}:
    get:
      summary: Get upload status
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadStatus" }
  /api/assets:
    get:
      summary: List all uploaded, non-deleted assets with processing and review status
      parameters:
        - { name: view, in: query, description: Pending review or published assets, schema: { type: string, enum: [pending, published], default: published } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 8 } }
        - { name: tag, in: query, description: Case-insensitive partial tag match applied only when view is published, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: Asset page with numeric pagination metadata
  /api/assets/{assetId}:
    parameters:
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get asset detail
      responses:
        "200": { description: Asset detail }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Replace editable metadata
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetEdit" }
      responses:
        "200": { description: Updated detail }
    delete:
      summary: Soft-delete asset and enqueue cleanup
      responses:
        "204": { description: Deleted }
  /api/assets/{assetId}/publish:
    post:
      summary: Publish a completed asset
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Published detail }
  /api/assets/{assetId}/retry:
    post:
      summary: Requeue a failed asset
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Requeued status }
  /api/media/{assetId}:
    get:
      summary: Stream original media with Range support
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: download, in: query, description: Set to 1 to return the original file as an attachment, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: Full media }
        "206": { description: Partial media }
components:
  responses:
    Error:
      description: Stable error response
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { $ref: "#/components/schemas/FailureCode" }
                  message: { type: string }
  schemas:
    FailureCode:
      type: string
      enum:
        - invalid_request
        - multiple_files
        - unsupported_media_type
        - file_too_large
        - corrupt_file
        - unsupported_video_codec
        - invalid_video_frames
        - model_not_configured
        - model_video_unsupported
        - video_frames_missing
        - model_request_failed
        - model_response_invalid
        - storage_error
        - internal_error
    UploadStatus:
      type: object
      required: [uploadId, assetId, mediaType, processingStatus, reviewStatus, progressPercent, failureCode, failureMessage]
      properties:
        uploadId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        mediaType: { type: string, enum: [image, video] }
        processingStatus: { type: string, enum: [queued, validating, analyzing, completed, failed] }
        reviewStatus: { type: string, enum: [pending_review, published, deleted] }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        failureCode:
          anyOf:
            - { $ref: "#/components/schemas/FailureCode" }
            - { type: "null" }
        failureMessage: { type: [string, "null"] }
    AssetEdit:
      type: object
      required: [name, description, tags]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 10000 }
        tags:
          type: array
          maxItems: 100
          items:
            type: object
            required: [category, value]
            properties:
              category: { type: string, minLength: 1, maxLength: 64 }
              value: { type: string, minLength: 1, maxLength: 128 }
